name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: no job here writes to the repo.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current.
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -x --tb=short -q -m "not integration"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"

      # Audit the locked runtime dependencies (all extras), not pip-audit's own environment.
      - name: Export locked requirements
        run: uv export --frozen --no-dev --all-extras --no-emit-project --format requirements-txt -o requirements.lock.txt

      - name: Run pip-audit
        run: uvx pip-audit==2.10.1 --progress-spinner off --disable-pip --require-hashes -r requirements.lock.txt

  wheel:
    name: Installed wheel smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel with freshly resolved dependencies (no lockfile)
        run: uv run --isolated --no-project --python 3.12 --with dist/*.whl python scripts/smoke_installed.py vault_fixture
