name: SAST (Semgrep)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly scan on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to Code Scanning
    container:
      # semgrep 1.187.0, pinned by digest. Bump by hand: Docker Hub tag -> digest
      image: semgrep/semgrep@sha256:0c8dfa7aa1ca8c50233ec9110e8cd88d139dedd603d56507493f74c6f4b3e062
    # Skip PRs from forks: they run untrusted code and cannot upload SARIF
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep (OSS rules)
        run: |
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --config .semgrep/ \
            --sarif-output semgrep.sarif \
            --json-output semgrep.json \
            src/
        # To publish results to semgrep.dev, add SEMGREP_APP_TOKEN to repo secrets

      - name: Fail on ERROR-level findings
        run: |
          count=$(python3 -c "
          import json, sys
          data = json.load(open('semgrep.json'))
          errors = [r for r in data.get('results', []) if r.get('extra', {}).get('severity') == 'ERROR']
          print(len(errors))
          ")
          if [ "$count" -gt 0 ]; then
            echo "::error::Semgrep found $count ERROR-level finding(s)"
            exit 1
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true  # SARIF upload requires Code Scanning to be enabled
