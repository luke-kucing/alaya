name: LongMemEval

# Retrieval benchmark (tests/eval/longmemeval, docs/benchmarks/longmemeval.md).
# Manual only. Every question has its own haystack and index, so questions shard cleanly
# across runners; a merge job combines the shards into one summary and uploads it.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel jobs (1-20)"
        default: "20"
      per_type:
        description: "Questions per type (blank = all 470)"
        default: ""
      variants:
        description: "Variants (alaya: base,hyde,rerank; baselines: bm25,dense)"
        default: "base,hyde,rerank,bm25,dense"
      budgets:
        description: "Token budgets"
        default: "1000,2000,4000"
      embedding_model:
        description: "Embedder key from alaya.index.models (nomic-v1.5, nomic-v1.5-q4, jina-v3)"
        default: "nomic-v1.5"

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: longmemeval-${{ inputs.embedding_model }}  # one run per embedder at a time; embedders run side by side
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps them current.
# Inputs reach shell steps only through env, never interpolated into scripts.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          PER_TYPE: ${{ inputs.per_type }}
          VARIANTS: ${{ inputs.variants }}
          BUDGETS: ${{ inputs.budgets }}
          EMBEDDING_MODEL: ${{ inputs.embedding_model }}
        run: |
          [[ "$EMBEDDING_MODEL" =~ ^[a-z0-9.-]+$ ]] || { echo "bad embedding_model"; exit 1; }
          [[ "$SHARDS" =~ ^([1-9]|1[0-9]|20)$ ]] || { echo "shards must be 1-20"; exit 1; }
          [[ -z "$PER_TYPE" || "$PER_TYPE" =~ ^[0-9]+$ ]] || { echo "per_type must be a number"; exit 1; }
          [[ "$VARIANTS" =~ ^[a-z0-9,-]+$ ]] || { echo "bad variants"; exit 1; }
          [[ "$BUDGETS" =~ ^[0-9,]+$ ]] || { echo "bad budgets"; exit 1; }
          echo "total=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -nc --argjson n "$SHARDS" '[range($n)]')" >> "$GITHUB_OUTPUT"

  shard:
    name: Shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Install (rerank + tiktoken token counts)
        run: |
          uv python install 3.12
          uv sync --locked --extra rerank --extra tokenizer

      - name: Download LongMemEval-S
        run: make eval-data

      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
          PER_TYPE: ${{ inputs.per_type }}
          VARIANTS: ${{ inputs.variants }}
          BUDGETS: ${{ inputs.budgets }}
          ALAYA_EMBEDDING_MODEL: ${{ inputs.embedding_model }}
        run: |
          uv run --no-sync python -m tests.eval.longmemeval.run --shard "$SHARD" \
            --variants "$VARIANTS" --budgets "$BUDGETS" ${PER_TYPE:+--per-type "$PER_TYPE"} > shard.out
          tail -3 shard.out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shard-${{ matrix.shard }}
          path: tests/eval/results/*-shard*.json
          retention-days: 14

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Merge and summarize
        run: |
          uv python install 3.12
          uv sync --locked
          rm -f tests/eval/results/*  # drop committed results so only this run's files are summarized and uploaded
          uv run --no-sync python -m tests.eval.longmemeval.run --merge shards/*.json > /dev/null
          cat tests/eval/results/*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: longmemeval-results
          path: |
            tests/eval/results/*.json
            tests/eval/results/*.md
          retention-days: 90
